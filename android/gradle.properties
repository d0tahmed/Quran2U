org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# JVM targets are aligned to 17 for every module in android/build.gradle.kts.
# Keep the check as a warning so one stray plugin module that hard-codes its own
# target cannot fail the whole build.
kotlin.jvm.target.validation.mode=warning
